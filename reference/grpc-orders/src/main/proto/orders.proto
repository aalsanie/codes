syntax = "proto3";

package example.orders.v1;

option java_multiple_files = true;
option java_package = "com.example.orders.grpc";

service Orders {
  rpc CreateOrder(CreateOrderRequest) returns (OrderReply);
  rpc GetOrder(GetOrderRequest) returns (OrderReply);
}

message CreateOrderRequest {
  string order_id = 1;
  string customer_id = 2;
  string product = 3;
}

message GetOrderRequest {
  string order_id = 1;
}

message OrderReply {
  string order_id = 1;
  string customer_id = 2;
  string product = 3;
  string status = 4;
}
