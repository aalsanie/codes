name: Release

on:
  push:
    tags:
      - "v*.*.*"
      - "!v*.*.*-*"

permissions:
  actions: read
  contents: read

concurrency:
  group: maven-central-release
  cancel-in-progress: false

jobs:
  preflight:
    name: Release preflight
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify required CI approver
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/environments/ci-approved" --jq \
            'if .can_admins_bypass == false then [.protection_rules[] | select(.type == "required_reviewers" and .prevent_self_review == false and (.reviewers | length) == 1 and .reviewers[0].type == "User" and .reviewers[0].reviewer.id == 22101794)] | length else 0 end' \
            | grep -qx '1'

  authorize:
    name: Approve release CI
    needs: preflight
    runs-on: ubuntu-latest
    environment:
      name: ci-approved
      deployment: false
    steps:
      - run: echo "Release CI approved"

  publish:
    needs: authorize
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify release tag
        shell: bash
        run: |
          set -euo pipefail

          version="$(sh ./scripts/version.sh)"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          test "${GITHUB_REF_NAME}" = "v${version}"

          git fetch --no-tags origin main
          test "$(git rev-parse "${GITHUB_SHA}^{commit}")" =                "$(git rev-parse "origin/main^{commit}")"

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c
        with:
          cache-provider: basic

      - name: Verify release tree
        run: |
          set -euo pipefail
          python scripts/verify-compatibility-matrix.py
          ./gradlew clean verifyAll --stacktrace

      - name: Build clean release artifacts
        run: sh scripts/prepare-compatibility-repository.sh build/release-maven

      - name: Verify Gradle consumers
        shell: bash
        run: |
          set -euo pipefail

          ./gradlew             -p smoke-test-java             "-Dmaven.repo.local=${GITHUB_WORKSPACE}/build/release-maven"             clean check             --stacktrace

          ./gradlew             -p smoke-test-kotlin             "-Dmaven.repo.local=${GITHUB_WORKSPACE}/build/release-maven"             clean check             --stacktrace

      - name: Verify Maven consumers
        shell: bash
        env:
          MAVEN_REPO_LOCAL: ${{ github.workspace }}/build/release-maven
        run: |
          set -euo pipefail
          version="$(sh ./scripts/version.sh)"

          mvn --batch-mode --no-transfer-progress             "-Dmaven.repo.local=${MAVEN_REPO_LOCAL}"             -f smoke-test-maven-java/pom.xml             "-Dcodes.version=$version"             clean verify

          sh ./scripts/verify-kotlin-nullability.sh 2.4.10

      - name: Publish to Maven Central
        run: >-
          ./gradlew
          :publishToMavenCentral
          :codes-spring:publishToMavenCentral
          --no-configuration-cache
          --stacktrace
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_IN_MEMORY_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_IN_MEMORY_KEY_PASSWORD }}

  github-release:
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Create GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          version="${GITHUB_REF_NAME#v}"

          awk -v version="$version" '
            $0 == "## " version {
              capture = 1
              next
            }
            capture && /^## / {
              exit
            }
            capture {
              print
            }
          ' CHANGELOG.md > release-notes.md

          test -s release-notes.md

          gh release create "$GITHUB_REF_NAME"             --verify-tag             --title "Codes $version"             --notes-file release-notes.md
