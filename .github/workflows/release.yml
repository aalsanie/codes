name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

concurrency:
  group: maven-central-release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify release tag
        shell: bash
        run: |
          set -euo pipefail

          version="$(sh ./scripts/version.sh)"

          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "Invalid release version: $version"
            exit 1
          }

          test "${GITHUB_REF_NAME}" = "v${version}"

          git fetch --no-tags origin main

          test "$(git rev-parse "${GITHUB_SHA}^{commit}")" = \
               "$(git rev-parse "origin/main^{commit}")"

      - uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0
        with:
          cache-provider: basic

      - name: Verify release tree
        run: ./gradlew clean verifyAll publishToMavenLocal --stacktrace

      - name: Verify Gradle Java consumer
        run: ./gradlew -p smoke-test-java clean check --stacktrace

      - name: Verify Gradle Kotlin consumer
        run: ./gradlew -p smoke-test-kotlin clean check --stacktrace

      - name: Verify Maven consumers
        shell: bash
        run: |
          set -euo pipefail
          version="$(sh ./scripts/version.sh)"
          mvn --batch-mode --no-transfer-progress \
            -f smoke-test-maven-java/pom.xml \
            -Dcodes.version="$version" \
            clean verify
          mvn --batch-mode --no-transfer-progress \
            -f smoke-test-maven-kotlin/pom.xml \
            -Dcodes.version="$version" \
            -Dkotlin.version=2.4.10 \
            clean verify

      - name: Publish Codes core to Maven Central
        run: ./gradlew publishToMavenCentral --no-configuration-cache --stacktrace
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_IN_MEMORY_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_IN_MEMORY_KEY_PASSWORD }}

  github-release:
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Create GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          version="${GITHUB_REF_NAME#v}"

          awk -v version="$version" '
            $0 == "## " version {
              capture = 1
              next
            }
            capture && /^## / {
              exit
            }
            capture {
              print
            }
          ' CHANGELOG.md > release-notes.md

          test -s release-notes.md

          gh release create "$GITHUB_REF_NAME" \
            --verify-tag \
            --title "Codes $version" \
            --notes-file release-notes.md
