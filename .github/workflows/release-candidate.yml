name: Release Candidate

on:
  push:
    tags:
      - "v*.*.*-RC*"

permissions:
  contents: read

concurrency:
  group: maven-central-release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    outputs:
      version: ${{ steps.version.outputs.value }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false

      - id: version
        name: Verify release-candidate tag
        shell: bash
        run: |
          set -euo pipefail

          version="$(sh ./scripts/version.sh)"

          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+-RC[1-9][0-9]*$ ]] || {
            echo "Invalid release-candidate version: $version"
            exit 1
          }

          test "${GITHUB_REF_NAME}" = "v${version}"

          git fetch --no-tags origin main

          test "$(git rev-parse "${GITHUB_SHA}^{commit}")" = \
               "$(git rev-parse "origin/main^{commit}")"

          echo "value=$version" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb
        with:
          cache-provider: basic

      - name: Verify release-candidate tree
        run: |
          python scripts/verify-compatibility-matrix.py
          ./gradlew clean verifyAll --stacktrace

      - name: Publish clean release-candidate artifacts
        run: bash scripts/prepare-compatibility-repository.sh build/compatibility-maven

      - name: Verify published-artifact consumers before Central
        shell: bash
        env:
          MAVEN_REPO_LOCAL: ${{ github.workspace }}/build/compatibility-maven
        run: |
          set -euo pipefail
          version="$(sh ./scripts/version.sh)"

          ./gradlew \
            -p smoke-test-java \
            "-Dmaven.repo.local=${MAVEN_REPO_LOCAL}" \
            clean check \
            --stacktrace

          ./gradlew \
            -p smoke-test-kotlin \
            "-Dmaven.repo.local=${MAVEN_REPO_LOCAL}" \
            clean check \
            --stacktrace

          mvn --batch-mode --no-transfer-progress \
            "-Dmaven.repo.local=${MAVEN_REPO_LOCAL}" \
            -f smoke-test-maven-java/pom.xml \
            "-Dcodes.version=$version" \
            clean verify

          bash ./scripts/verify-kotlin-nullability.sh 2.4.10

      - name: Publish all Codes artifacts to Maven Central
        run: >-
          ./gradlew
          :publishToMavenCentral
          :codes-spring:publishToMavenCentral
          :codes-grpc-java:publishToMavenCentral
          --no-configuration-cache
          --stacktrace
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_IN_MEMORY_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_IN_MEMORY_KEY_PASSWORD }}

  external-integrations:
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c
        with:
          distribution: temurin
          java-version: "21"

      - name: Verify external integrations from Maven Central
        run: >-
          bash scripts/verify-rc-integrations.sh
          "${{ needs.publish.outputs.version }}"
          build/reports/rc-integrations.md

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: rc-external-integrations
          path: |
            build/reports/rc-integrations.md
            build/rc-integrations/*.log
          if-no-files-found: warn
          retention-days: 30

  github-prerelease:
    needs: [publish, external-integrations]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Create GitHub prerelease
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          version="${GITHUB_REF_NAME#v}"

          awk -v version="$version" '
            $0 == "## " version {
              capture = 1
              next
            }
            capture && /^## / {
              exit
            }
            capture {
              print
            }
          ' CHANGELOG.md > release-notes.md

          test -s release-notes.md

          gh release create "$GITHUB_REF_NAME" \
            --verify-tag \
            --prerelease \
            --title "Codes $version" \
            --notes-file release-notes.md
