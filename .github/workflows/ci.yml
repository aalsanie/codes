name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0
        with:
          cache-provider: basic

      - name: Verify core, adapters, and references
        run: ./gradlew clean verifyAll --stacktrace

      - name: Publish all artifacts to Maven Local
        run: >-
          ./gradlew
          :publishToMavenLocal
          :codes-spring:publishToMavenLocal
          :codes-grpc-java:publishToMavenLocal
          --stacktrace

      - name: Verify local publication files
        run: sh ./scripts/verify-local-publications.sh

      - name: Verify Gradle Java consumer
        run: ./gradlew -p smoke-test-java clean check --stacktrace

      - name: Verify Gradle Kotlin consumer
        run: ./gradlew -p smoke-test-kotlin clean check --stacktrace

      - name: Verify Maven Java consumer
        shell: bash
        run: |
          set -euo pipefail
          version="$(sh ./scripts/version.sh)"
          mvn --batch-mode --no-transfer-progress \
            -f smoke-test-maven-java/pom.xml \
            -Dcodes.version="$version" \
            clean verify

      - name: Verify Maven Kotlin consumer
        run: sh ./scripts/verify-kotlin-nullability.sh 2.4.10

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: coverage-reports
          path: build/reports/jacoco
          if-no-files-found: warn
          retention-days: 14

  kotlin-consumers:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        kotlin: ["1.9.24", "2.0.21", "2.1.21", "2.2.20", "2.4.10"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0
        with:
          cache-provider: basic

      - name: Publish core locally
        run: ./gradlew :publishToMavenLocal --stacktrace

      - name: Verify Kotlin consumer
        run: sh ./scripts/verify-kotlin-nullability.sh "${{ matrix.kotlin }}"

  kotlin-consumers-gate:
    name: Kotlin consumers gate
    if: always()
    needs: [kotlin-consumers]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify Kotlin consumer matrix
        env:
          RESULT: ${{ needs.kotlin-consumers.result }}
        shell: bash
        run: |
          if [ "$RESULT" != "success" ]; then
            echo "Kotlin consumer matrix result: $RESULT"
            exit 1
          fi

  runtime-jdks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        java: ["21", "25"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}

      - uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0
        with:
          cache-provider: basic

      - name: Test core on runtime JDK
        run: ./gradlew :test --stacktrace

  operating-systems:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0
        with:
          cache-provider: basic

      - name: Test core and adapters
        run: ./gradlew :test :codes-spring:test :codes-grpc-java:test --stacktrace
