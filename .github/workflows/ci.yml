name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  actions: read
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  matrix:
    name: Preflight
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      expensive: ${{ steps.changes.outputs.expensive }}
      runtime_jdks: ${{ steps.matrix.outputs.runtime_jdks }}
      kotlin: ${{ steps.matrix.outputs.kotlin }}
      os: ${{ steps.matrix.outputs.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify compatibility policy
        run: python scripts/verify-compatibility-matrix.py

      - name: Classify changes
        id: changes
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          import subprocess

          expensive = True
          if os.environ["GITHUB_EVENT_NAME"] == "pull_request":
              base, head = os.environ["BASE_SHA"], os.environ["HEAD_SHA"]
              changed = subprocess.check_output([
                  "git", "diff", "--no-renames", "--name-only", "-z", f"{base}...{head}"
              ])
              paths = [p for p in changed.decode("utf-8", "surrogateescape").split("\0") if p]
              def trivial(path):
                  return (
                      path in ("README.md", "CHANGELOG.md")
                      or (path.startswith("docs/") and path.endswith((".md", ".png", ".jpg", ".jpeg", ".svg", ".webp")))
                      or (path.startswith(".github/ISSUE_TEMPLATE/") and path.endswith(".md"))
                  )
              expensive = not (paths and all(map(trivial, paths)))
              subprocess.run(["git", "diff", "--check", f"{base}...{head}"], check=True)
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              out.write(f"expensive={str(expensive).lower()}\n")
          PY

      - name: Verify required CI approver
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/environments/ci-approved" --jq \
            'if .can_admins_bypass == false then [.protection_rules[] | select(.type == "required_reviewers" and .prevent_self_review == false and (.reviewers | length) == 1 and .reviewers[0].type == "User" and .reviewers[0].reviewer.id == 22101794)] | length else 0 end' \
            | grep -qx '1'

      - id: matrix
        name: Export required check matrices
        shell: bash
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from pathlib import Path

          matrix = json.loads(Path("compatibility/matrix.json").read_text(encoding="utf-8"))
          compact = lambda value: json.dumps(value, separators=(",", ":"))

          print("runtime_jdks=" + compact({
              "java": [version for version in matrix["java"] if version != "17"]
          }))
          print("kotlin=" + compact({
              "kotlin": matrix["kotlin"]["versions"]
          }))
          print("os=" + compact({
              "os": matrix["os"]
          }))
          PY

  authorize:
    name: Approve expensive CI
    needs: matrix
    if: needs.matrix.outputs.expensive == 'true'
    runs-on: ubuntu-latest
    environment:
      name: ci-approved
      deployment: false
    steps:
      - run: echo "CI approved"

  verify:
    needs: [matrix, authorize]
    if: needs.authorize.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92
        with:
          cache-provider: basic

      - name: Verify library and reference application
        run: ./gradlew clean verifyAll --stacktrace

      - name: Publish clean compatibility artifacts
        run: sh scripts/prepare-compatibility-repository.sh build/compatibility-maven

      - name: Verify Gradle Java consumer
        run: >-
          ./gradlew
          -p smoke-test-java
          -Dmaven.repo.local=${{ github.workspace }}/build/compatibility-maven
          clean check
          --stacktrace

      - name: Verify Gradle Kotlin consumer
        run: >-
          ./gradlew
          -p smoke-test-kotlin
          -Dmaven.repo.local=${{ github.workspace }}/build/compatibility-maven
          clean check
          --stacktrace

      - name: Verify Maven Java consumer
        shell: bash
        run: |
          set -euo pipefail
          version="$(sh ./scripts/version.sh)"
          mvn --batch-mode --no-transfer-progress             "-Dmaven.repo.local=${GITHUB_WORKSPACE}/build/compatibility-maven"             -f smoke-test-maven-java/pom.xml             "-Dcodes.version=$version"             clean verify

      - name: Verify Maven Kotlin consumer
        env:
          MAVEN_REPO_LOCAL: ${{ github.workspace }}/build/compatibility-maven
        run: sh ./scripts/verify-kotlin-nullability.sh 2.4.10

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: coverage-reports
          path: |
            build/reports/jacoco
            codes-spring/build/reports/jacoco
          if-no-files-found: warn
          retention-days: 14

  kotlin-consumers:
    needs: [matrix, authorize]
    if: needs.authorize.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.matrix.outputs.kotlin) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92
        with:
          cache-provider: basic

      - name: Publish clean compatibility artifacts
        run: sh scripts/prepare-compatibility-repository.sh build/compatibility-maven

      - name: Verify Kotlin consumer
        env:
          MAVEN_REPO_LOCAL: ${{ github.workspace }}/build/compatibility-maven
        run: sh scripts/verify-kotlin-nullability.sh "${{ matrix.kotlin }}"

  kotlin-consumers-gate:
    name: Kotlin consumers gate
    if: always() && needs.authorize.result == 'success'
    needs: [matrix, authorize, kotlin-consumers]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require Kotlin consumer matrix
        shell: bash
        env:
          MATRIX_RESULT: ${{ needs.matrix.result }}
          KOTLIN_RESULT: ${{ needs.kotlin-consumers.result }}
        run: |
          set -euo pipefail
          test "$MATRIX_RESULT" = "success"
          test "$KOTLIN_RESULT" = "success"

  runtime-jdks:
    needs: [matrix, authorize]
    if: needs.authorize.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.matrix.outputs.runtime_jdks) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}

      - uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92
        with:
          cache-provider: basic

      - name: Publish clean compatibility artifacts
        run: sh scripts/prepare-compatibility-repository.sh build/compatibility-maven

      - name: Verify Java consumer on runtime JDK
        run: >-
          ./gradlew
          -p smoke-test-java
          -Dmaven.repo.local=${{ github.workspace }}/build/compatibility-maven
          -PconsumerJavaVersion=${{ matrix.java }}
          clean check
          --stacktrace

  operating-systems:
    needs: [matrix, authorize]
    if: needs.authorize.result == 'success'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.matrix.outputs.os) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92
        with:
          cache-provider: basic

      - name: Verify published consumers on Unix
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          sh scripts/prepare-compatibility-repository.sh build/compatibility-maven

          ./gradlew             -p smoke-test-java             "-Dmaven.repo.local=${GITHUB_WORKSPACE}/build/compatibility-maven"             clean check             --stacktrace

          ./gradlew             -p smoke-test-kotlin             "-Dmaven.repo.local=${GITHUB_WORKSPACE}/build/compatibility-maven"             clean check             --stacktrace

      - name: Verify published consumers on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $repo = Join-Path $env:GITHUB_WORKSPACE "build\compatibility-maven"

          .\gradlew.bat "-Dmaven.repo.local=$repo" :publishToMavenLocal :codes-spring:publishToMavenLocal --stacktrace
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          .\gradlew.bat -p smoke-test-java "-Dmaven.repo.local=$repo" clean check --stacktrace
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          .\gradlew.bat -p smoke-test-kotlin "-Dmaven.repo.local=$repo" clean check --stacktrace
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  compatibility:
    name: Compatibility
    needs: authorize
    if: needs.authorize.result == 'success'
    uses: ./.github/workflows/compatibility.yml
    permissions:
      contents: read

  codeql:
    name: CodeQL
    needs: authorize
    if: needs.authorize.result == 'success'
    uses: ./.github/workflows/codeql.yml
    permissions:
      contents: read
      security-events: write

  required:
    name: Required checks
    if: always()
    needs: [matrix, authorize, verify, kotlin-consumers, kotlin-consumers-gate, runtime-jdks, operating-systems, compatibility, codeql]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify required jobs
        shell: bash
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          python - <<'PY'
          import json
          import os
          import sys

          needs = json.loads(os.environ["NEEDS_JSON"])
          results = {name: job["result"] for name, job in needs.items()}
          if results["matrix"] != "success":
              sys.exit("Preflight failed")
          expensive = needs["matrix"]["outputs"].get("expensive")
          if expensive not in ("true", "false"):
              sys.exit("Invalid change classification")
          expected = "success" if expensive == "true" else "skipped"
          for name in ("authorize", "verify", "kotlin-consumers", "kotlin-consumers-gate",
                       "runtime-jdks", "operating-systems", "compatibility", "codeql"):
              if results[name] != expected:
                  sys.exit(f"{name}: expected {expected}, got {results[name]}")
          print("All applicable checks passed")
          PY
