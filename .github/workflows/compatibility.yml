name: Compatibility

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: compatibility-${{ github.ref }}
  cancel-in-progress: true

jobs:
  matrix:
    name: Matrix policy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      java_spring: ${{ steps.matrix.outputs.java_spring }}
      kotlin: ${{ steps.matrix.outputs.kotlin }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Verify matrix policy
        run: python scripts/verify-compatibility-matrix.py

      - id: matrix
        name: Export matrices
        shell: bash
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from pathlib import Path

          matrix = json.loads(Path("compatibility/matrix.json").read_text(encoding="utf-8"))
          compact = lambda value: json.dumps(value, separators=(",", ":"))

          print("java_spring=" + compact({
              "java": matrix["java"],
              "spring": matrix["spring"],
          }))

          kotlin = matrix["kotlin"]
          print("kotlin=" + compact({
              "include": [
                  {
                      "kotlin": version,
                      "spring": kotlin["spring"],
                  }
                  for version in kotlin["versions"]
              ]
          }))
          PY

  contracts:
    name: Artifact contracts and coverage
    needs: [matrix]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6
        with:
          cache-provider: basic

      - name: Verify contracts
        run: ./gradlew clean verifyAll --stacktrace

      - name: Build clean publication repository
        run: sh scripts/prepare-compatibility-repository.sh build/compatibility-maven

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: compatibility-publications
          path: build/compatibility-maven
          if-no-files-found: error
          retention-days: 1

  java-spring:
    needs: [matrix, contracts]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.matrix.outputs.java_spring) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}

      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6
        with:
          cache-provider: basic

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: compatibility-publications
          path: build/compatibility-maven

      - name: Test Spring bridge against selected Spring version
        run: >-
          ./gradlew
          :codes-spring:test
          -PspringFrameworkOverride=${{ matrix.spring }}
          --stacktrace

      - name: Verify Gradle Java consumer
        run: >-
          ./gradlew
          -p smoke-test-java
          -Dmaven.repo.local=${{ github.workspace }}/build/compatibility-maven
          -PconsumerJavaVersion=${{ matrix.java }}
          -PspringFrameworkOverride=${{ matrix.spring }}
          clean check
          --stacktrace

      - name: Verify Maven Java consumer
        shell: bash
        run: |
          set -euo pipefail
          version="$(sh scripts/version.sh)"
          mvn --batch-mode --no-transfer-progress             "-Dmaven.repo.local=${GITHUB_WORKSPACE}/build/compatibility-maven"             -f smoke-test-maven-java/pom.xml             "-Dcodes.version=$version"             "-Dmaven.compiler.release=${{ matrix.java }}"             "-Dspring.framework.version=${{ matrix.spring }}"             clean verify

  kotlin:
    needs: [matrix, contracts]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.matrix.outputs.kotlin) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: compatibility-publications
          path: build/compatibility-maven

      - name: Verify Kotlin consumer
        env:
          MAVEN_REPO_LOCAL: ${{ github.workspace }}/build/compatibility-maven
        run: >-
          sh scripts/verify-kotlin-nullability.sh
          "${{ matrix.kotlin }}"
          "${{ matrix.spring }}"

  compatibility-gate:
    name: Compatibility gate
    if: always()
    needs: [matrix, contracts, java-spring, kotlin]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require all compatibility checks
        shell: bash
        env:
          MATRIX: ${{ needs.matrix.result }}
          CONTRACTS: ${{ needs.contracts.result }}
          JAVA_SPRING: ${{ needs.java-spring.result }}
          KOTLIN: ${{ needs.kotlin.result }}
        run: |
          set -euo pipefail
          test "$MATRIX" = "success"
          test "$CONTRACTS" = "success"
          test "$JAVA_SPRING" = "success"
          test "$KOTLIN" = "success"
