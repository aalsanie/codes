name: Compatibility

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: compatibility-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92
        with:
          cache-provider: basic

      - name: Verify compatibility policy
        run: python scripts/verify-compatibility-matrix.py

      - name: Verify contracts
        run: ./gradlew clean verifyAll --stacktrace

      - name: Build clean publication repository
        run: sh scripts/prepare-compatibility-repository.sh build/compatibility-maven

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: compatibility-publications
          path: build/compatibility-maven
          if-no-files-found: error
          retention-days: 1

  java-spring:
    needs: contracts
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        java: ["17", "21", "25"]
        spring: ["6.0.0", "7.0.9"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}

      - uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92
        with:
          cache-provider: basic

      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
        with:
          name: compatibility-publications
          path: build/compatibility-maven

      - name: Test Spring bridge against selected Spring version
        run: >-
          ./gradlew
          :codes-spring:test
          -PspringFrameworkOverride=${{ matrix.spring }}
          --stacktrace

      - name: Verify Gradle Java consumer
        run: >-
          ./gradlew
          -p smoke-test-java
          -Dmaven.repo.local=${{ github.workspace }}/build/compatibility-maven
          -PconsumerJavaVersion=${{ matrix.java }}
          -PspringFrameworkOverride=${{ matrix.spring }}
          clean check
          --stacktrace

      - name: Verify Maven Java consumer
        shell: bash
        run: |
          set -euo pipefail
          version="$(sh scripts/version.sh)"
          mvn --batch-mode --no-transfer-progress             "-Dmaven.repo.local=${GITHUB_WORKSPACE}/build/compatibility-maven"             -f smoke-test-maven-java/pom.xml             "-Dcodes.version=$version"             "-Dmaven.compiler.release=${{ matrix.java }}"             "-Dspring.framework.version=${{ matrix.spring }}"             clean verify

  kotlin:
    needs: contracts
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        kotlin: ["1.9.24", "2.4.10"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
        with:
          name: compatibility-publications
          path: build/compatibility-maven

      - name: Verify Kotlin consumer
        env:
          MAVEN_REPO_LOCAL: ${{ github.workspace }}/build/compatibility-maven
        run: sh scripts/verify-kotlin-nullability.sh "${{ matrix.kotlin }}"

  compatibility-gate:
    name: Compatibility gate
    if: always()
    needs: [contracts, java-spring, kotlin]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require all compatibility checks
        shell: bash
        env:
          CONTRACTS: ${{ needs.contracts.result }}
          JAVA_SPRING: ${{ needs.java-spring.result }}
          KOTLIN: ${{ needs.kotlin.result }}
        run: |
          set -euo pipefail
          test "$CONTRACTS" = "success"
          test "$JAVA_SPRING" = "success"
          test "$KOTLIN" = "success"
