name: CodeQL

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "23 4 * * 1"

permissions:
  contents: read
  security-events: write

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          cache-provider: basic

      - uses: github/codeql-action/init@cdf488f595d80d6e07e03d4674febd5ab45fa938
        with:
          languages: java-kotlin
          build-mode: manual

      - name: Build production and reference code
        run: >-
          ./gradlew clean
          :testClasses
          :codes-spring:testClasses
          :codes-grpc-java:testClasses
          :reference-spring-orders:testClasses
          :reference-grpc-orders:testClasses
          --stacktrace

      - uses: github/codeql-action/analyze@cdf488f595d80d6e07e03d4674febd5ab45fa938
