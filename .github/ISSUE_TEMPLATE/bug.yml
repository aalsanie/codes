name: Bug report
description: Report incorrect Codes behavior.
title: "bug: "
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: Codes version
      placeholder: 0.3.0
    validations:
      required: true
  - type: dropdown
    id: language
    attributes:
      label: Consumer language
      options: [Java, Kotlin, Other JVM]
    validations:
      required: true
  - type: input
    id: jdk
    attributes:
      label: JDK version
      placeholder: 17
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: reproducer
    attributes:
      label: Minimal reproducer
      description: Include the smallest code or repository that demonstrates the problem.
    validations:
      required: true
