name: Change request
description: Propose a problem type or Spring integration change.
title: "request: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Describe the application problem, not the proposed API first.
    validations:
      required: true
  - type: textarea
    id: current
    attributes:
      label: Current approach
      description: Show how the problem is handled without the proposed change.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
    validations:
      required: true
  - type: checkboxes
    id: contract
    attributes:
      label: Contract impact
      options:
        - label: This changes ProblemType validation or semantics.
        - label: This changes the public Java API.
        - label: This changes Spring ProblemDetail conversion behavior.
        - label: This changes compatibility, dependency, or publication behavior.
